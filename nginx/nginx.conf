events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Reverse Proxy Upstream for RAG Agent backend instances
    upstream rag_backend {
        server rag-agent:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Support large multi-document uploads (PDF, DOCX, CSV, TXT up to 100MB)
        client_max_body_size 100M;
        client_body_buffer_size 128k;

        # Timeouts for heavy LLM queries & streaming inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Reverse Proxy with SSE Streaming support
        location / {
            proxy_pass http://rag_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            # Client identity propagation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical: Disable buffering for Server-Sent Events (SSE) live document status updates
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # Load balancer & proxy health checks
        location ~ ^/(health|healthz|ping|api/health) {
            proxy_pass http://rag_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
