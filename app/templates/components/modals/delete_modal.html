<!-- Universal Delete / Detach Confirmation Modal -->
<div id="delete-confirm-modal" class="modal-overlay" style="z-index: 1000;">
  <div class="modal-card" style="max-width: 480px;">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="delete-modal-header-icon" style="font-size: 1.25rem;">🗑️</span>
        <h3 id="delete-modal-title" style="margin: 0; font-size: 1.05rem; font-weight: 600;">Confirm Deletion</h3>
      </div>
      <button id="close-delete-modal-btn" class="modal-close" type="button" aria-label="Close modal">&times;</button>
    </div>

    <div style="padding: 16px 0;">
      <div id="delete-modal-item-box" style="display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--bg-tertiary); border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 14px;">
        <span id="delete-modal-file-icon" style="font-size: 1.5rem;">📄</span>
        <div style="overflow: hidden; flex: 1;">
          <div id="delete-modal-filename" style="font-weight: 600; font-size: 0.9rem; color: var(--text-primary); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">Item Name</div>
          <div id="delete-modal-filemeta" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px;">Details</div>
        </div>
      </div>

      <p id="delete-modal-prompt-text" style="font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; margin: 0;">
        Are you sure you want to delete this item? This action cannot be undone.
      </p>
    </div>

    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap;">
      <button type="button" id="delete-modal-cancel-btn" class="btn btn-outline">Cancel</button>
      <button type="button" id="delete-modal-detach-btn" class="btn btn-warning" style="display: none;">Remove from Room</button>
      <button type="button" id="delete-modal-confirm-btn" class="btn btn-danger">Confirm Delete</button>
    </div>
  </div>
</div>
