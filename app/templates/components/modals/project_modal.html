<!-- Project Creation & Management Modal -->
<div id="project-modal" class="modal-overlay">
  <div class="modal-card" style="max-width: 540px;">
    <div class="modal-header">
      <h3 style="display: flex; align-items: center; gap: 8px;">
        <span>📁</span>
        <span id="project-modal-title">New Project</span>
      </h3>
      <button id="close-project-btn" class="modal-close">&times;</button>
    </div>

    <form id="project-form" novalidate style="padding: 16px 0;">
      <input type="hidden" id="project-id-input" value="">

      <div style="margin-bottom: 14px;">
        <label for="project-name-input" style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">
          Project / Application Name <span style="color: #ef4444;">*</span>
        </label>
        <input type="text" id="project-name-input" class="form-control" placeholder="e.g. Telemedicine Mobile App, Financial Due Diligence" required style="width: 100%; font-size: 0.85rem;">
      </div>

      <div style="margin-bottom: 14px;">
        <label for="project-desc-input" style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">
          Project Scope &amp; Deliverables
        </label>
        <textarea id="project-desc-input" class="form-control" rows="3" placeholder="Outline the primary deliverables, modules, or scope of this project..." style="width: 100%; font-size: 0.82rem; resize: vertical;"></textarea>
      </div>

      <!-- Application Request Specific Section (Collapsible or Always Accessible) -->
      <div style="background: rgba(99, 102, 241, 0.05); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 8px; padding: 12px; margin-bottom: 14px;">
        <div style="font-size: 0.74rem; font-weight: 600; color: #818cf8; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;">
          <span>📞 Client Contact &amp; Consultation Channel</span>
          <span style="font-size: 0.65rem; color: var(--text-muted);">Synced to Projects table</span>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
          <div>
            <label for="project-client-name-input" style="font-size: 0.74rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Requester Name</label>
            <input type="text" id="project-client-name-input" class="form-control" placeholder="John Doe" style="width: 100%; font-size: 0.8rem;">
          </div>
          <div>
            <label for="project-email-input" style="font-size: 0.74rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Email Address</label>
            <input type="email" id="project-email-input" class="form-control" placeholder="john@company.com" style="width: 100%; font-size: 0.8rem;">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <label for="project-phone-input" style="font-size: 0.74rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Phone Number</label>
            <input type="tel" id="project-phone-input" class="form-control" placeholder="+1 (555) 019-2834" style="width: 100%; font-size: 0.8rem;">
          </div>
          <div>
            <label for="project-channel-select" style="font-size: 0.74rem; color: var(--text-muted); display: block; margin-bottom: 4px;">Communication Channel</label>
            <select id="project-channel-select" class="form-control" style="width: 100%; font-size: 0.8rem;">
              <option value="Gmeet">🟢 Google Meet (Gmeet)</option>
              <option value="Teams">🟣 Microsoft Teams</option>
              <option value="Zoom">🔵 Zoom</option>
              <option value="others">⚪ Others (Phone / Slack / Direct)</option>
            </select>
          </div>
        </div>

        <div id="project-transcripts-indicator" style="display: none; margin-top: 10px; font-size: 0.72rem; color: var(--text-secondary); background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 6px; border: 1px dashed rgba(255,255,255,0.1);">
          <span>📜 Conversation Transcripts attached</span>
          <button type="button" id="project-open-call-btn" class="btn btn-outline" style="font-size: 0.68rem; padding: 2px 8px; margin-left: 10px;">
            📞 Open Call Workspace
          </button>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-bottom: 14px;">
        <div style="flex: 1;">
          <label for="project-status-select" style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Status</label>
          <select id="project-status-select" class="form-control" style="width: 100%; font-size: 0.82rem;">
            <option value="active">Active</option>
            <option value="pending_call">Pending Call</option>
            <option value="call_initiated">Call Initiated</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label for="project-tags-input" style="font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Tags (comma-separated)</label>
          <input type="text" id="project-tags-input" class="form-control" placeholder="app-request, gmeet, mvp" style="width: 100%; font-size: 0.82rem;">
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button type="button" class="btn btn-outline" id="cancel-project-btn">Cancel</button>
        <button type="submit" formnovalidate class="btn btn-primary" id="save-project-btn">Save Project</button>
      </div>
    </form>
  </div>
</div>
