<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Production-ready AI-powered document ingestion and real-time RAG Agent system.">
  <title>{% block title %}Production RAG Agent{% endblock %}</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/variables.css?v=v2">
  <link rel="stylesheet" href="/static/css/sidebar.css?v=v2">
  <link rel="stylesheet" href="/static/css/chat.css?v=v2">
  <link rel="stylesheet" href="/static/css/modals.css?v=v2">
  <link rel="stylesheet" href="/static/css/responsive.css?v=v2">
  <link rel="stylesheet" href="/static/css/app.css?v=v2">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <!-- Notification Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JavaScript Modules -->
  <script src="/static/js/api.js?v=v6_validation"></script>
  <script src="/static/js/sse.js?v=v6_validation"></script>
  <script src="/static/js/modules/utils.js?v=v6_validation"></script>
  <script src="/static/js/modules/validator.js?v=v6_validation"></script>
  <script src="/static/js/modules/markdown.js?v=v6_validation"></script>
  <script src="/static/js/modules/auth.js?v=v6_validation"></script>
  <script src="/static/js/modules/rooms.js?v=v6_validation"></script>
  <script src="/static/js/modules/documents.js?v=v6_validation"></script>
  <script src="/static/js/modules/memory.js?v=v6_validation"></script>
  <script src="/static/js/modules/history.js?v=v6_validation"></script>
  <script src="/static/js/modules/evidence.js?v=v6_validation"></script>
  <script src="/static/js/modules/settings.js?v=v6_validation"></script>
  <script src="/static/js/modules/chat.js?v=v6_validation"></script>
  <script src="/static/js/app.js?v=v6_validation"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
